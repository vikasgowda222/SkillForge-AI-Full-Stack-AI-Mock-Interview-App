name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, test, build
    runs-on: ubuntu-latest

    # Placeholder env so `next build` can compile. These are NOT real secrets;
    # they only need to be well-formed. Real values live in the deploy platform.
    env:
      DATABASE_URL: postgresql://user:password@ep-example.us-east-1.aws.neon.tech/skillforge?sslmode=require
      GEMINI_API_KEY: test-gemini-key
      GEMINI_MODEL: gemini-1.5-flash
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_dummydummydummydummydummydummy00
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format code
        run: npm run format

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
